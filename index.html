<style>
  :root{ --brand:#4228EB; --brand-2:#6B54F5; }
  *{box-sizing:border-box}
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#1a1350,#0b0a1f);color:#fff}
  #card{width:100%;max-width:400px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
    border-radius:18px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
  .dot{width:44px;height:44px;border-radius:12px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:19px;margin:0 0 4px;font-weight:700}
  p.sub{margin:0 0 22px;font-size:13.5px;color:#b9b6d6}
  input{width:100%;padding:13px 15px;border-radius:11px;border:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.25);color:#fff;font-size:15px;outline:none;text-align:center}
  input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(107,84,245,.25)}
  button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:15px;font-weight:700}
  button:active{transform:translateY(1px)}
  .err{min-height:18px;margin-top:12px;font-size:13px;color:#ff8a8a}
  .foot{margin-top:18px;font-size:11.5px;color:#6f6c93}
</style>
<div id="gate">
  <form id="card" autocomplete="off">
    <div class="dot">🔒</div>
    <h1>Roteiro de Call · Bequest</h1>
    <p class="sub">Material interno. Digite a senha pra acessar.</p>
    <input id="pw" type="password" placeholder="Senha" autofocus autocomplete="off">
    <button type="submit" id="go">Entrar</button>
    <div class="err" id="err"></div>
    <div class="foot">Bequest · uso interno do time comercial</div>
  </form>
</div>

  function b2u(b64){ var bin=atob(b64), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
  async function decrypt(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
